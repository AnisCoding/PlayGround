<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Share+Tech+Mono&display=swap');
:root{--ink:#f7e9cc;--red:#ed4b32;--gold:#e4b85d;--muted:#a7967c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0b;color:var(--ink);font-family:'Barlow Condensed',Impact,sans-serif}body{user-select:none}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#171311}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}#scene{filter:contrast(1.07) saturate(.9)}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 28%,rgba(9,7,6,.45) 76%,rgba(7,6,5,.88) 130%);z-index:2}.scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,.24) 4px)}
#topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:clamp(16px,3vw,34px) clamp(18px,4vw,54px);pointer-events:none}.brand{font-size:clamp(19px,2.1vw,27px);font-weight:900;letter-spacing:.13em;line-height:.9;text-shadow:0 2px 8px #000}.brand small{display:block;color:var(--red);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.28em;margin-top:8px}.objective{text-align:right;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.09em;color:#d0c0a5;text-shadow:0 2px 5px #000}.objective strong{display:block;font-family:'Barlow Condensed',sans-serif;font-size:19px;letter-spacing:.12em;color:var(--ink);margin-bottom:3px}.objective em{font-style:normal;color:var(--red)}
#hud{position:absolute;z-index:5;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-between;padding:20px clamp(18px,4vw,54px) clamp(21px,4vh,38px);pointer-events:none}.stat{display:flex;align-items:center;gap:12px;min-width:150px}.stat-icon{width:37px;height:37px;border:1px solid rgba(232,208,166,.4);display:grid;place-items:center;color:var(--gold);font-size:20px;background:rgba(13,11,9,.48);transform:rotate(45deg)}.stat-icon span{transform:rotate(-45deg)}.stat-label{font-family:'Share Tech Mono',monospace;color:#a89a81;font-size:9px;letter-spacing:.22em}.stat-value{font-size:29px;font-weight:800;line-height:1;letter-spacing:.05em}.healthbar{width:104px;height:3px;background:#4b3329;margin-top:5px}.healthbar i{display:block;height:100%;width:100%;background:var(--red);transition:width .25s}.ammo{display:flex;align-items:center;gap:15px;text-align:right}.ammo .stat-value{font-size:24px;color:var(--gold)}.bullet-icon{width:12px;height:28px;background:linear-gradient(90deg,#8e5e2e,#e1b45e 45%,#75502c);clip-path:polygon(25% 35%,25% 0,75% 0,75% 35%,100% 100%,0 100%);filter:drop-shadow(0 0 7px rgba(230,173,72,.5))}.bullet-icon.empty{opacity:.18;filter:grayscale(1)}#center{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none}.crosshair{width:22px;height:22px;position:relative;opacity:.9}.crosshair:before,.crosshair:after{content:'';position:absolute;background:rgba(255,235,196,.9);box-shadow:0 0 5px #f4c679}.crosshair:before{width:1px;height:20px;left:10px;top:1px}.crosshair:after{height:1px;width:20px;left:1px;top:10px}.crosshair .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#ed4b32;left:9px;top:9px}#prompt{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:6;color:#f4d38b;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.13em;text-shadow:0 2px 8px #000;white-space:nowrap;opacity:0;transition:opacity .2s}#prompt.show{opacity:1}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(10,8,7,.82),rgba(10,8,7,.5) 55%,rgba(10,8,7,.15)),radial-gradient(ellipse at 68% 50%,transparent 0,rgba(9,7,6,.5) 100%);transition:opacity .45s,visibility .45s}#overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.panel{width:min(600px,88vw);margin-left:min(6vw,78px);margin-right:auto;position:relative}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--red);font-family:'Share Tech Mono',monospace;letter-spacing:.28em;font-size:11px}.eyebrow:before{content:'';width:26px;height:1px;background:var(--red)}h1{font-size:clamp(70px,12.5vw,150px);font-weight:900;line-height:.76;letter-spacing:-.045em;margin:19px 0 22px;text-shadow:0 8px 35px rgba(0,0,0,.5)}h1 span{display:block;color:var(--red)}.subtitle{font-size:clamp(14px,1.8vw,19px);letter-spacing:.07em;color:#d2c2a7;max-width:400px;line-height:1.35}.subtitle b{color:#f3d28e;font-weight:600}.rule{width:68px;height:2px;background:var(--gold);margin:25px 0 20px}.instructions{display:flex;gap:22px;flex-wrap:wrap;font-family:'Share Tech Mono',monospace;font-size:10px;color:#b8aa94;letter-spacing:.08em}.instructions strong{color:#f4e5ca;font-size:11px}.key{display:inline-block;border:1px solid #6f5c45;padding:3px 6px;margin-right:5px;color:#eadbbd}.start{margin-top:30px;border:0;background:var(--red);color:#fff3dc;padding:14px 28px;font:800 16px 'Barlow Condensed',sans-serif;letter-spacing:.19em;cursor:pointer;clip-path:polygon(0 0,93% 0,100% 25%,100% 100%,7% 100%,0 75%);transition:transform .15s,background .15s}.start:hover{transform:translateY(-2px);background:#ff6043}.start small{font:10px 'Share Tech Mono',monospace;opacity:.75;margin-left:12px}.corner{position:absolute;right:clamp(18px,4vw,54px);bottom:clamp(18px,4vh,38px);font-family:'Share Tech Mono',monospace;font-size:9px;color:#827460;letter-spacing:.2em;z-index:3}.mobile-controls{display:none;position:absolute;z-index:7;inset:auto 0 85px;padding:0 22px;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,43px);gap:4px;pointer-events:auto}.touchbtn{border:1px solid rgba(255,239,210,.32);background:rgba(15,12,10,.42);color:#f5e7cf;display:grid;place-items:center;font-size:16px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.actions{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}.actions button{width:62px;height:62px;border-radius:50%;background:rgba(144,37,26,.54);border:1px solid rgba(238,91,62,.7);font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:.08em;color:#ffe8cb;touch-action:none}.actions button.reload{width:48px;height:48px;border-color:rgba(224,182,99,.6);background:rgba(100,75,37,.5)}#toast{position:absolute;z-index:7;top:20%;left:50%;transform:translate(-50%,-8px);padding:9px 16px;background:rgba(15,11,9,.82);border-left:2px solid var(--gold);color:#f4d38b;font:11px 'Share Tech Mono',monospace;letter-spacing:.12em;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}#damage{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse,transparent 40%,rgba(210,24,17,.6));opacity:0;transition:opacity .2s}.hitflash{animation:flash .2s}@keyframes flash{50%{background:rgba(255,210,150,.22)}}
@media(max-width:650px){#topbar{padding-top:18px}.objective{font-size:9px}.objective strong{font-size:16px}.stat{min-width:auto}.stat-icon{width:30px;height:30px}.stat-value{font-size:24px}.healthbar{width:75px}.mobile-controls{display:flex}.corner{display:none}#hud{padding-bottom:18px}.ammo .stat-value{font-size:19px}.panel{margin:0 8vw}h1{font-size:clamp(72px,18vw,112px)}.instructions{gap:10px}}
</style>
</head>
<body><main id="game"><canvas id="scene"></canvas><div class="vignette"></div><div class="scanlines"></div><div id="damage"></div>
<header id="topbar"><div class="brand">ASHFALL <small>SECTOR 09 // 03:17 AM</small></div><div class="objective"><strong id="objectiveTitle">CLEAR THE NEST</strong><span>HOSTILES <em id="kills">0 / 4</em></span></div></header>
<div id="center"><div class="crosshair"><i class="dot"></i></div></div><div id="prompt"></div><div id="toast"></div>
<footer id="hud"><div class="stat"><div class="stat-icon"><span>✚</span></div><div><div class="stat-label">VITALS</div><div class="stat-value" id="healthNum">100</div><div class="healthbar"><i id="healthBar"></i></div></div></div><div class="ammo"><div><div class="stat-label">CHAMBER</div><div class="stat-value" id="ammoLabel">ROUND READY</div></div><i class="bullet-icon" id="bulletIcon"></i></div></footer>
<div class="mobile-controls"><div class="pad"><button class="touchbtn up" data-move="forward">▲</button><button class="touchbtn left" data-move="left">◀</button><button class="touchbtn down" data-move="back">▼</button><button class="touchbtn right" data-move="right">▶</button></div><div class="actions"><button class="reload" id="pickupBtn">PICK<br>UP</button><button id="fireBtn">FIRE</button></div></div>
<div id="overlay"><section class="panel"><div class="eyebrow">A ONE-ROUND NIGHTMARE</div><h1>ONE<span>ROUND</span></h1><p class="subtitle">Four things in the dark. <b>One bullet.</b><br>Put it where it counts. Then go get it back.</p><div class="rule"></div><div class="instructions"><span><strong><i class="key">WASD</i></strong> MOVE</span><span><strong><i class="key">MOUSE</i></strong> AIM</span><span><strong><i class="key">CLICK</i></strong> FIRE</span><span><strong><i class="key">E</i></strong> RETRIEVE</span></div><button class="start" id="startBtn">ENTER THE DARK <small>▶</small></button></section><div class="corner">AN ASHFALL INCIDENT // 09.17.84</div></div>
</main>
<script>
(() => {
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const W=480,H=270,FOV=Math.PI/3,MAX=14;
canvas.width=W;canvas.height=H;
const map=[
'1111111111111111',
'1000000000000001',
'1011110111101101',
'1000010000100001',
'1111011110101101',
'1001000000100001',
'1001011111110101',
'1001000000000101',
'1011110111100101',
'1000000100000001',
'1011100101111101',
'1000100000000001',
'1110111110101101',
'1000000010000001',
'1000000000000001',
'1111111111111111'];
const wallAt=(x,y)=>{const a=map[Math.floor(y)]||'';return a[Math.floor(x)]!=='0'};
const player={x:1.65,y:1.65,a:.12,hp:100,ammo:true,damage:0};
let started=false,dead=false,won=false,last=0,depth=new Float32Array(W),shotFlash=0,noise=0,walk=0;
const enemies=[{x:6.5,y:1.6,hp:1},{x:13.6,y:3.5,hp:1},{x:2.5,y:9.5,hp:1},{x:13.5,y:13.5,hp:1}].map((e,i)=>({...e,alive:true,phase:i*2.7,hit:0,attack:0}));
let bullet=null,bulletAnim=0,toastTimer=0;
function resize(){const d=Math.min(2,devicePixelRatio||1);canvas.style.imageRendering='pixelated';}window.addEventListener('resize',resize);resize();
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function blocked(x,y,r=.18){return wallAt(x-r,y-r)||wallAt(x+r,y-r)||wallAt(x-r,y+r)||wallAt(x+r,y+r)}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');toastTimer=1.5}
function updateHud(){document.getElementById('healthNum').textContent=Math.ceil(player.hp);document.getElementById('healthBar').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammoLabel').textContent=player.ammo?'ROUND READY':bullet?'ROUND LOST':'ROUND SPENT';document.getElementById('ammoLabel').style.color=player.ammo?'#e4b85d':'#ed4b32';document.getElementById('bulletIcon').classList.toggle('empty',!player.ammo);document.getElementById('kills').textContent=`${enemies.filter(e=>!e.alive).length} / 4`;document.getElementById('objectiveTitle').textContent=won?'EXIT SECURED':enemies.every(e=>!e.alive)?'RECOVER THE ROUND':'CLEAR THE NEST'}
function wallDistance(angle){let sin=Math.sin(angle),cos=Math.cos(angle);for(let t=.02;t<MAX;t+=.025){if(wallAt(player.x+cos*t,player.y+sin*t))return t}return MAX}
function shoot(){if(!started||dead||won)return;if(!player.ammo){showToast(bullet?'Your round is out there. Retrieve it.':'No round in the chamber.');return}player.ammo=false;shotFlash=.9;noise=.8;let target=null,best=Infinity;
for(const e of enemies){if(!e.alive)continue;const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),delta=Math.atan2(Math.sin(Math.atan2(dy,dx)-player.a),Math.cos(Math.atan2(dy,dx)-player.a));if(Math.abs(delta)<.11&&d<wallDistance(player.a)+.1&&d<best){best=d;target=e}}
if(target){target.alive=false;target.hit=1;bullet={x:target.x,y:target.y};showToast('CLEAN HIT. THE ROUND IS STILL LIVE.');}else{const d=Math.max(1,wallDistance(player.a)-.35);bullet={x:player.x+Math.cos(player.a)*d,y:player.y+Math.sin(player.a)*d};showToast('MISSED. YOUR ONLY ROUND IS ON THE FLOOR.')}updateHud();document.getElementById('game').classList.remove('hitflash');void document.getElementById('game').offsetWidth;document.getElementById('game').classList.add('hitflash');}
function retrieve(){if(!started||!bullet)return;if(dist(player,bullet)<.82){bullet=null;player.ammo=true;showToast('ROUND RECOVERED. MAKE IT COUNT.');updateHud();if(enemies.every(e=>!e.alive)){won=true;setTimeout(()=>endScreen(true),650)}}else showToast('TOO FAR. MOVE CLOSER TO THE ROUND.')}
function endScreen(win){dead=!win;started=false;document.getElementById('overlay').classList.remove('hidden');document.querySelector('.eyebrow').textContent=win?'SECTOR 09 // CLEARED':'SIGNAL LOST // 03:19 AM';document.querySelector('h1').innerHTML=win?'NEST<span>EMPTY</span>':'YOU<span>FELL</span>';document.querySelector('.subtitle').innerHTML=win?'Four down. One round recovered.<br><b>Nothing left in the dark.</b>':'The dark always gets its due.<br><b>One more run?</b>';document.getElementById('startBtn').innerHTML='RUN IT BACK <small>▶</small>';document.querySelector('.instructions').innerHTML='THE ROUND IS THE ONLY WAY THROUGH.'}
document.getElementById('startBtn').addEventListener('click',()=>{if(dead||won)location.reload();started=true;document.getElementById('overlay').classList.add('hidden');if(!('ontouchstart'in window))canvas.requestPointerLock?.();last=performance.now()});
canvas.addEventListener('click',()=>{if(started){if(document.pointerLockElement!==canvas&& !('ontouchstart'in window))canvas.requestPointerLock?.();else shoot()}});
document.addEventListener('mousemove',e=>{if(started&&document.pointerLockElement===canvas)player.a+=e.movementX*.0022});
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='e')retrieve();if(e.key===' '||e.key.toLowerCase()==='f')shoot();if(e.key==='Escape'&&started)document.exitPointerLock?.()});
let keys={};document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('fireBtn').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});document.getElementById('pickupBtn').addEventListener('pointerdown',e=>{e.preventDefault();retrieve()});
document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();keys['touch-'+b.dataset.move]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys['touch-'+b.dataset.move]=false))});
function drawWorld(){
 const sky=ctx.createLinearGradient(0,0,0,H*.53);sky.addColorStop(0,'#1b1716');sky.addColorStop(.78,'#42302a');sky.addColorStop(1,'#75503a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.53);
 const floor=ctx.createLinearGradient(0,H*.48,0,H);floor.addColorStop(0,'#594132');floor.addColorStop(.14,'#31251f');floor.addColorStop(1,'#100d0c');ctx.fillStyle=floor;ctx.fillRect(0,H*.48,W,H*.52);
 // Perspective floor seams and scattered warm reflections.
 ctx.lineWidth=1;for(let row=0;row<8;row++){let y=H*.53+row*row*2.7+3;ctx.strokeStyle=`rgba(190,130,73,${.075-row*.007})`;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let x=-W;x<W*2;x+=36){ctx.strokeStyle='rgba(190,130,73,.055)';ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.08,H*.53);ctx.lineTo(x,H);ctx.stroke()}
 for(let x=0;x<W;x++){let angle=player.a+Math.atan((x-W/2)/(H*.5/Math.tan(FOV/2))),sin=Math.sin(angle),cos=Math.cos(angle),d=MAX,side=0,hitX=0,hitY=0;
  for(let t=.02;t<MAX;t+=.035){let px=player.x+cos*t,py=player.y+sin*t;if(wallAt(px,py)){d=t;side=Math.abs((px-Math.floor(px))-.5)>Math.abs((py-Math.floor(py))-.5)?0:1;hitX=px;hitY=py;break}}
  const corrected=d*Math.cos(angle-player.a);depth[x]=corrected;const wh=Math.min(H*2,H*.86/Math.max(.05,corrected)),top=(H-wh)/2;let u=side===0?hitY-Math.floor(hitY):hitX-Math.floor(hitX);if((side===0&&cos>0)||(side===1&&sin<0))u=1-u;
  // Industrial blockwork, with a bright edge seam and cracked oxide pattern.
  const brick=Math.floor((side===0?hitY:hitX)*2.1)%2, mortar=(u<.035||u>.97)||((Math.floor((side===0?hitY:hitX)*2.1)%2===0)&&((side===0?hitY:hitX)%1<.055));
  let shade=1/(1+corrected*.105);shade*=side===1?.79:1;let r=91*shade,g=53*shade,b=39*shade;
  if(brick){r*=.83;g*=.83;b*=.84}if(mortar){r*=.53;g*=.55;b*=.55}
  // Light pools at corridor intersections.
  const glow=Math.max(0,1-Math.hypot((hitX%6)-3,(hitY%6)-3)/3.2)*.12*shade;r+=22*glow;g+=13*glow;b+=5*glow;
  ctx.fillStyle=`rgb(${Math.min(255,r|0)},${Math.min(255,g|0)},${Math.min(255,b|0)})`;ctx.fillRect(x,top,1,wh);
  if(u<.045||u>.955){ctx.fillStyle=`rgba(237,177,104,${.13*shade})`;ctx.fillRect(x,top,1,wh)}
 }
 drawSprites();drawWeapon();
}
function drawSprites(){
 const things=[];for(const e of enemies)if(e.alive)things.push({type:'enemy',x:e.x,y:e.y,e,d:dist(player,e)});if(bullet)things.push({type:'bullet',x:bullet.x,y:bullet.y,d:dist(player,bullet)});
 things.sort((a,b)=>b.d-a.d);const focal=H*.5/Math.tan(FOV/2);
 for(const o of things){let dx=o.x-player.x,dy=o.y-player.y,a=Math.atan2(dy,dx)-player.a;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)>FOV*.72||o.d<.2)continue;let sx=W/2+Math.tan(a)*focal,scale=focal/o.d;
  if(o.type==='bullet'){let size=Math.max(2,scale*.19),ground=H/2+scale*.48;if(sx<0||sx>=W||o.d>depth[Math.max(0,Math.min(W-1,sx|0))])continue;ctx.save();ctx.translate(sx,ground);ctx.rotate(-.25);ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(0,2,size*1.1,size*.38,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='#efbd5d';ctx.shadowBlur=10;ctx.fillStyle='#dca747';ctx.fillRect(-size*.3,-size*1.8,size*.6,size*1.8);ctx.fillStyle='#ffe18a';ctx.beginPath();ctx.moveTo(-size*.3,-size*1.8);ctx.lineTo(0,-size*2.35);ctx.lineTo(size*.3,-size*1.8);ctx.fill();ctx.restore();continue}
  const h=scale*1.18,base=H/2+scale*.48,left=sx-h*.38,top=base-h;if(left+h*.76<0||left>W)continue;const ix=Math.max(0,Math.floor(sx));if(o.d>depth[ix])continue;const wob=Math.sin(performance.now()*.004+o.e.phase)*h*.018;ctx.save();ctx.translate(sx,0);ctx.translate(0,wob);
  // Ground shadow
  ctx.fillStyle='rgba(0,0,0,.48)';ctx.beginPath();ctx.ellipse(0,base, h*.35,h*.085,0,0,Math.PI*2);ctx.fill();
  // Long arms and ragged silhouette
  ctx.fillStyle='#38201c';ctx.beginPath();ctx.moveTo(-h*.25,top+h*.34);ctx.lineTo(-h*.46,top+h*.58);ctx.lineTo(-h*.40,top+h*.66);ctx.lineTo(-h*.17,top+h*.52);ctx.lineTo(h*.18,top+h*.52);ctx.lineTo(h*.39,top+h*.67);ctx.lineTo(h*.48,top+h*.58);ctx.lineTo(h*.26,top+h*.31);ctx.closePath();ctx.fill();
  let body=ctx.createLinearGradient(-h*.25,0,h*.25,0);body.addColorStop(0,'#341d19');body.addColorStop(.45,'#8a3829');body.addColorStop(1,'#48221b');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(-h*.23,top+h*.28);ctx.lineTo(h*.22,top+h*.28);ctx.lineTo(h*.34,base-h*.06);ctx.lineTo(h*.21,base);ctx.lineTo(-h*.21,base);ctx.lineTo(-h*.34,base-h*.06);ctx.closePath();ctx.fill();
  ctx.fillStyle='#251714';ctx.beginPath();ctx.ellipse(0,top+h*.2,h*.2,h*.22,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9e4735';ctx.beginPath();ctx.moveTo(-h*.18,top+h*.23);ctx.lineTo(-h*.12,top+h*.04);ctx.lineTo(h*.12,top+h*.04);ctx.lineTo(h*.18,top+h*.23);ctx.lineTo(0,top+h*.29);ctx.fill();
  ctx.fillStyle='#ffd16a';ctx.shadowColor='#ff642e';ctx.shadowBlur=h*.12;ctx.fillRect(-h*.105,top+h*.17,h*.065,h*.035);ctx.fillRect(h*.04,top+h*.17,h*.065,h*.035);ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(227,139,92,.42)';ctx.lineWidth=Math.max(.6,h*.025);ctx.beginPath();ctx.moveTo(0,top+h*.3);ctx.lineTo(0,base-h*.15);ctx.stroke();ctx.restore();
 }
}
function drawWeapon(){const bob=started?Math.sin(walk*9)*2:0;const cx=W*.5,by=H+8+bob;ctx.save();ctx.translate(cx,by);ctx.fillStyle='#171414';ctx.beginPath();ctx.moveTo(-72,0);ctx.lineTo(-50,-37);ctx.lineTo(-29,-48);ctx.lineTo(35,-48);ctx.lineTo(60,-29);ctx.lineTo(80,0);ctx.closePath();ctx.fill();ctx.fillStyle='#392b25';ctx.fillRect(-23,-77,46,43);ctx.fillStyle='#6b5540';ctx.fillRect(-17,-83,34,8);ctx.fillStyle='#1b1715';ctx.fillRect(-12,-79,24,44);ctx.fillStyle='#705437';ctx.fillRect(-7,-75,14,32);ctx.fillStyle='#281c17';ctx.fillRect(-33,-39,66,34);ctx.fillStyle='#a54b30';ctx.fillRect(-3,-34,6,9);if(!player.ammo){ctx.fillStyle='#100e0d';ctx.fillRect(-10,-77,20,19)}ctx.restore();
}
function move(dt){let f=0,s=0,turn=0;if(keys.w||keys.arrowup||keys['touch-forward'])f++;if(keys.s||keys.arrowdown||keys['touch-back'])f--;if(keys.a) s--;if(keys.d)s++;if(keys['touch-left'])turn-=1;if(keys['touch-right'])turn+=1;if(keys.arrowleft)turn-=1;if(keys.arrowright)turn+=1;player.a+=turn*dt*2.2;let speed=2.7*dt;if(keys.shift)speed*=1.35;let dx=(Math.cos(player.a)*f-Math.sin(player.a)*s)*speed,dy=(Math.sin(player.a)*f+Math.cos(player.a)*s)*speed;if(dx||dy){walk+=dt*8;let nx=player.x+dx,ny=player.y+dy;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}}
function enemyUpdate(dt){for(const e of enemies){if(!e.alive)continue;e.attack-=dt;let d=dist(player,e);e.phase+=dt*2;if(d<.66){if(e.attack<=0){player.hp-=9;player.damage=1;e.attack=.8;document.getElementById('damage').style.opacity='.8';setTimeout(()=>document.getElementById('damage').style.opacity='0',140);updateHud();if(player.hp<=0){player.hp=0;updateHud();endScreen(false);return}}continue}
 if(d<9){let dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1;let step=dt*.72;let nx=e.x+dx/len*step,ny=e.y+dy/len*step;if(!blocked(nx,e.y,.2))e.x=nx;if(!blocked(e.x,ny,.2))e.y=ny;}}
}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(started){move(dt);enemyUpdate(dt);if(bullet&&dist(player,bullet)<.66&&!keys.e){document.getElementById('prompt').textContent='E  /  RETRIEVE THE ROUND';document.getElementById('prompt').classList.add('show')}else document.getElementById('prompt').classList.remove('show');if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').classList.remove('show')}}drawWorld();requestAnimationFrame(loop)}
requestAnimationFrame(loop);updateHud();
})();
